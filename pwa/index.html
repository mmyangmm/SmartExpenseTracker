<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ff6b9d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="i 記帳">
    <title>i 記帳</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <link rel="stylesheet" href="./styles.css?v=12">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-icon" id="brandIcon" aria-hidden="true">i</span>
          <div>
            <h1>i 記帳</h1>
            <p id="todayLabel"></p>
          </div>
        </div>
      </header>

      <main id="mainContent">
        <section class="view active" id="homeView" aria-labelledby="homeTitle">
          <section class="summary-panel month-card">
            <div class="month-bar">
              <button class="icon-button" data-month="-1" type="button" aria-label="上個月">
                <span aria-hidden="true">‹</span>
              </button>
              <div class="month-title">
                <h2 id="homeTitle"></h2>
                <button class="month-pill" id="goCurrentMonth" type="button" hidden>回到本月</button>
              </div>
              <button class="icon-button" data-month="1" type="button" aria-label="下個月">
                <span aria-hidden="true">›</span>
              </button>
            </div>

            <div class="summary-grid">
              <div>
                <span class="metric-label expense-dot">支出</span>
                <strong id="monthExpense">NT$0</strong>
              </div>
              <div>
                <span class="metric-label income-dot">收入</span>
                <strong class="income" id="monthIncome">NT$0</strong>
              </div>
            </div>

            <div class="compare-copy">
              <span>本月消費</span>
              <span>6個月平均</span>
            </div>
            <div class="meter" aria-hidden="true"><span id="averageMeter"></span></div>
            <div class="compare-row">
              <span id="currentExpenseLabel">NT$0</span>
              <span id="averageLabel">NT$0</span>
            </div>
          </section>

          <section class="category-strip" id="categoryStrip" aria-label="分類摘要"></section>

          <section class="list-section" aria-labelledby="recentTitle">
            <div class="section-heading">
              <h3 id="recentTitle">最近記錄</h3>
              <span id="recordCount"></span>
            </div>
            <div class="transaction-list" id="transactionList"></div>
          </section>
        </section>

        <section class="view" id="statsView" aria-labelledby="statsTitle">
          <div class="section-heading stats-heading">
            <h2 id="statsTitle">統計</h2>
            <select id="statsMode" aria-label="圖表類型">
              <option value="category">分類</option>
              <option value="daily">每日</option>
            </select>
          </div>
          <section class="summary-panel stats-panel">
            <div id="chartCanvas" class="chart-canvas"></div>
          </section>
          <section class="list-section">
            <div class="section-heading">
              <h3>明細排行</h3>
              <span id="statsCount"></span>
            </div>
            <div id="statsList" class="stats-list"></div>
          </section>
        </section>

        <section class="view" id="settingsView" aria-labelledby="settingsTitle">
          <div class="section-heading settings-title">
            <h2 id="settingsTitle">設定</h2>
          </div>
          <section class="settings-stack">
            <section class="settings-card" aria-labelledby="themeTitle">
              <div class="settings-card-head">
                <div>
                  <h3 id="themeTitle">主題色彩</h3>
                  <span id="themeSummary"></span>
                </div>
              </div>
              <div class="option-grid theme-options" id="themeOptions" aria-label="主題色彩"></div>
            </section>

            <section class="settings-card" aria-labelledby="iconTitle">
              <div class="settings-card-head">
                <div>
                  <h3 id="iconTitle">App 圖示</h3>
                  <span id="iconSummary"></span>
                </div>
              </div>
              <div class="option-grid icon-options" id="iconOptions" aria-label="App 圖示"></div>
            </section>

            <section class="settings-card" aria-labelledby="travelTitle">
              <div class="settings-card-head">
                <div>
                  <h3 id="travelTitle">出國模式</h3>
                  <span id="travelStatus"></span>
                </div>
                <label class="switch">
                  <input id="travelModeEnabled" type="checkbox" aria-label="開啟出國模式">
                  <span aria-hidden="true"></span>
                </label>
              </div>
              <div class="settings-control-row">
                <label for="travelCurrency">記帳幣別</label>
                <select id="travelCurrency"></select>
              </div>
              <div class="settings-control-row">
                <span id="travelRateLabel">匯率待更新</span>
                <button class="mini-button" id="refreshTravelRate" type="button">更新</button>
              </div>
            </section>

            <section class="settings-card" aria-labelledby="converterTitle">
              <div class="settings-card-head">
                <div>
                  <h3 id="converterTitle">換匯</h3>
                  <span id="converterStatus"></span>
                </div>
                <button class="mini-button" id="refreshConverterRates" type="button">更新</button>
              </div>
              <div class="converter-list" id="converterList"></div>
              <div class="currency-manager" aria-labelledby="currencyManagerTitle">
                <div class="settings-control-row converter-add-row">
                  <label id="currencyManagerTitle" for="converterAddCurrency">新增幣別</label>
                  <select id="converterAddCurrency"></select>
                  <button class="mini-button" id="addConverterCurrency" type="button">新增</button>
                </div>
                <p class="settings-note">在任一幣別輸入金額即可作為基準；用 ↑ ↓ 調整順序。</p>
              </div>
            </section>

            <section class="settings-card" aria-labelledby="reminderTitle">
              <div class="settings-card-head">
                <div>
                  <h3 id="reminderTitle">通知提醒</h3>
                  <span id="notificationStatus"></span>
                </div>
                <label class="switch">
                  <input id="reminderEnabled" type="checkbox" aria-label="開啟通知提醒">
                  <span aria-hidden="true"></span>
                </label>
              </div>
              <div class="settings-control-row reminder-time-row">
                <label for="reminderTime">提醒時間</label>
                <input id="reminderTime" type="time" value="21:00">
              </div>
              <div class="button-grid">
                <button class="settings-action" id="requestNotification" type="button">允許通知</button>
                <button class="settings-action" id="testNotification" type="button">測試通知</button>
              </div>
            </section>

            <section class="settings-card" aria-labelledby="cloudSyncTitle">
              <div class="settings-card-head">
                <div>
                  <h3 id="cloudSyncTitle">Google 雲端同步</h3>
                  <span id="cloudSyncStatus"></span>
                </div>
              </div>
              <div class="cloud-user" id="cloudUserCard" hidden>
                <span class="cloud-avatar" id="cloudUserAvatar" aria-hidden="true"></span>
                <div>
                  <strong id="cloudUserName"></strong>
                  <span id="cloudUserEmail"></span>
                </div>
              </div>
              <div class="button-grid cloud-actions">
                <button class="settings-action primary-action" id="googleSignIn" type="button">使用 Google 登入</button>
                <button class="settings-action" id="syncNow" type="button">立即同步</button>
                <button class="settings-action" id="googleSignOut" type="button">登出</button>
              </div>
              <p class="settings-note">登入後會透過 Firebase Authentication 與 Firestore 合併並自動同步本機資料。</p>
            </section>

            <section class="settings-card" aria-labelledby="dataTitle">
              <div class="settings-card-head">
                <div>
                  <h3 id="dataTitle">資料管理</h3>
                  <span id="dataCount"></span>
                </div>
              </div>
              <div class="settings-list">
                <button id="exportJson" class="settings-row" type="button">
                  <span>匯出備份</span>
                  <strong>JSON</strong>
                </button>
                <button id="copyJson" class="settings-row" type="button">
                  <span>複製備份</span>
                  <strong>剪貼簿</strong>
                </button>
                <button id="exportCsv" class="settings-row" type="button">
                  <span>匯出表格</span>
                  <strong>CSV</strong>
                </button>
                <label class="settings-row file-row">
                  <span>匯入備份</span>
                  <strong>JSON</strong>
                  <input id="importJson" type="file" accept="application/json,.json">
                </label>
                <button id="clearData" class="settings-row danger-row" type="button">
                  <span>清除資料</span>
                  <strong>全部</strong>
                </button>
              </div>
            </section>
          </section>
        </section>
      </main>

      <button class="fab" id="addButton" type="button" aria-label="新增記錄">記帳</button>

      <nav class="tabbar" aria-label="主要分頁">
        <button class="tab active" data-tab="home" type="button" aria-current="page">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11.3 12 4l9 7.3v8.2a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/></svg>
          <span>首頁</span>
        </button>
        <button class="tab" data-tab="stats" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 3.06A9 9 0 1 0 20.94 13H11z"/><path d="M13 3.06V11h7.94A9 9 0 0 0 13 3.06z"/></svg>
          <span>統計</span>
        </button>
        <button class="tab" data-tab="settings" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 8.2A3.8 3.8 0 1 0 12 15.8 3.8 3.8 0 0 0 12 8.2zm8.5 3.8-1.8-1 .2-2-2.2-2.2-2 .2-1-1.8h-3.4l-1 1.8-2-.2-2.2 2.2.2 2-1.8 1v3.4l1.8 1-.2 2 2.2 2.2 2-.2 1 1.8h3.4l1-1.8 2 .2 2.2-2.2-.2-2 1.8-1z"/></svg>
          <span>設定</span>
        </button>
      </nav>
    </div>

    <dialog id="entryDialog" class="quick-add-dialog">
      <form id="entryForm" method="dialog">
        <div class="dialog-head">
          <button class="toolbar-button" id="cancelEntry" value="cancel" type="button">取消</button>
          <h2 id="dialogTitle">快速記帳</h2>
          <button class="toolbar-button danger-toolbar" id="deleteEntry" type="button" hidden>刪除</button>
        </div>

        <input type="hidden" id="entryId">
        <input type="hidden" id="categoryInput">
        <input type="hidden" id="noteInput">
        <input type="hidden" id="dateInput">
        <input id="amountInput" class="sr-only" inputmode="decimal" autocomplete="off" aria-describedby="amountError" tabindex="-1" aria-hidden="true">

        <div class="quick-add-scroll">
          <div class="segmented" role="radiogroup" aria-label="收支類型">
            <label>
              <input type="radio" name="entryType" value="expense" checked>
              <span>支出</span>
            </label>
            <label>
              <input type="radio" name="entryType" value="income">
              <span>收入</span>
            </label>
          </div>

          <section class="amount-card" aria-live="polite">
            <div class="amount-type">
              <span id="amountSign" aria-hidden="true">−</span>
              <span id="currencySymbol">NT$</span>
            </div>
            <strong id="amountDisplay">0</strong>
            <p class="amount-hint" id="twdHint" hidden></p>
            <p class="field-error" id="amountError" hidden>請輸入金額</p>
          </section>

          <section class="category-panel" aria-labelledby="categoryTitle">
            <div class="panel-title" id="categoryTitle">分類</div>
            <div class="category-grid" id="categoryGrid" role="radiogroup" aria-label="分類"></div>
          </section>

        </div>

        <div class="status-banner voice-banner" id="voiceBanner" hidden aria-live="polite"></div>
        <div class="status-banner scan-banner" id="scanBanner" hidden aria-live="polite"></div>

        <div class="calc-keyboard" aria-label="數字鍵盤">
          <div class="calc-row">
            <button type="button" class="calc-key" data-key="7">7</button>
            <button type="button" class="calc-key" data-key="8">8</button>
            <button type="button" class="calc-key" data-key="9">9</button>
          </div>
          <div class="calc-row">
            <button type="button" class="calc-key" data-key="4">4</button>
            <button type="button" class="calc-key" data-key="5">5</button>
            <button type="button" class="calc-key" data-key="6">6</button>
          </div>
          <div class="calc-row">
            <button type="button" class="calc-key" data-key="1">1</button>
            <button type="button" class="calc-key" data-key="2">2</button>
            <button type="button" class="calc-key" data-key="3">3</button>
          </div>
          <div class="calc-row">
            <button type="button" class="calc-key" data-key=".">.</button>
            <button type="button" class="calc-key" data-key="0">0</button>
            <button type="button" class="calc-key delete-key" data-key="delete" aria-label="刪除一位">⌫</button>
          </div>
          <div class="action-row">
            <button type="button" class="action-key scan-key icon-action" id="scanReceipt" aria-label="掃描收據">
              <span class="action-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M9 6l1.3-2h3.4L15 6h3.5A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8A2.5 2.5 0 0 1 5.5 6H9z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
              </span>
            </button>
            <button type="submit" class="action-key save-key" id="saveEntry" aria-label="儲存記帳">
              <span class="action-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg>
              </span>
              <strong>儲存</strong>
            </button>
            <button type="button" class="action-key mic-key icon-action" id="voiceButton" aria-label="語音記帳">
              <span class="action-icon voice-icon" aria-hidden="true" id="voiceIcon">
                <svg class="voice-symbol mic-symbol" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/><path d="M8.5 21h7"/></svg>
                <svg class="voice-symbol stop-symbol" viewBox="0 0 24 24"><path d="M8 8h8v8H8z"/></svg>
              </span>
              <strong id="voiceLabel" class="sr-only">語音記帳</strong>
            </button>
          </div>
        </div>

        <input id="receiptInput" type="file" accept="image/*" capture="environment" hidden>
      </form>
    </dialog>

    <template id="emptyTemplate">
      <div class="empty-state">
        <div aria-hidden="true">💸</div>
        <strong>本月還沒有記錄</strong>
        <span>點下方「記帳」開始記帳吧！</span>
      </div>
    </template>

    <script src="./firebase-config.js?v=12"></script>
    <script src="./app.js?v=12" type="module"></script>
  </body>
</html>
